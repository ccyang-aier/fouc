name: fouc-datastore-lab

# Dedicated user-datasource fixtures; never the Fouc account/tenant database.
services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${FOUC_MYSQL_LAB_ROOT_PASSWORD:?Run node scripts/datastore-lab.mjs up}
      MYSQL_DATABASE: fouc_datastore_lab
      MYSQL_USER: fouc_lab
      MYSQL_PASSWORD: ${FOUC_MYSQL_LAB_PASSWORD:?Run node scripts/datastore-lab.mjs up}
    ports:
      - "53306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -Nse 'SELECT 1' | grep -q '^1$$'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  mysql-data:
