name: fouc-dev

# Local development PostgreSQL, Redis and attachment storage.
# Ports bind 0.0.0.0 inside the WSL NAT network: the Windows host reaches them
# via the WSL address (see infra.mjs endpoint sync), while physical
# LAN peers cannot route into the WSL NAT. The Windows→WSL loopback relay is
# intentionally avoided: it cannot sustain pooled concurrent connections.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FOUC_POSTGRES_USER:?Run infra.mjs init}
      POSTGRES_PASSWORD: ${FOUC_POSTGRES_PASSWORD:?Run infra.mjs init}
      POSTGRES_DB: ${FOUC_POSTGRES_DB:?Run infra.mjs init}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "${FOUC_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${FOUC_REDIS_PASSWORD:?Run infra.mjs init}
    command: ["/bin/sh", "-ec", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "${FOUC_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: fouc-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./backend/server/scripts
      dockerfile: infra-minio.Dockerfile
      # Build-time only: lets an existing loopback proxy in WSL serve downloads.
      # The running services continue to use the isolated Compose network.
      network: host
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Run infra.mjs init}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Run infra.mjs init}
      MINIO_REGION_NAME: ${S3_REGION:-us-east-1}
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:59001
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${FOUC_MINIO_PORT:-59000}:9000"
      - "${FOUC_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

# infra.mjs selects a free subnet after checking Docker and host interfaces.
networks:
  default:
    ipam:
      config:
        - subnet: ${FOUC_DEV_SUBNET:?Run infra.mjs up}

volumes:
  postgres-data:
  redis-data:
  minio-data:
