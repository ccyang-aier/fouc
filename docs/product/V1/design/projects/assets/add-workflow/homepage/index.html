<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fouc · 工作台首页五套设计</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px;color:#202020;background:#efefef}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:18px;min-height:52px;padding:8px 16px;flex-shrink:0;background:white;border-bottom:1px solid #ddd}.identity{white-space:nowrap;line-height:1.5}.identity strong{font-size:13px}.identity small{display:block;font-size:11px;color:#767676}nav{display:flex;gap:4px}button,a{font:inherit;border-radius:6px;white-space:nowrap}button{height:30px;padding:0 11px;border:0;color:inherit;background:transparent;cursor:pointer}button:hover,a:hover{background:#f6f6f6}button[aria-pressed="true"]{color:white;background:#202020}button:focus-visible,a:focus-visible{outline:1px solid #777;outline-offset:2px}a{padding:6px;text-decoration:none;color:#555}.tools{display:flex;align-items:center;gap:6px;margin-left:auto}main{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;padding:14px}figure{max-width:1600px;width:100%;margin:0 auto}img{display:block;width:100%;height:auto;border:1px solid #ddd;background:white}main[data-scale="actual"] figure{max-width:none;width:max-content}main[data-scale="actual"] img{width:auto}main[data-scale="page"]{display:flex;justify-content:center;align-items:flex-start}main[data-scale="page"] figure{height:100%;width:100%;max-width:none}main[data-scale="page"] img{height:100%;width:100%;object-fit:contain;border:0;background:transparent}footer{display:flex;align-items:center;gap:12px;min-height:32px;flex-shrink:0;padding:4px 16px;border-top:1px solid #ddd;background:white;color:#767676;font-size:12px}#caption{color:#404040}#status{font-size:11px}footer a{margin-left:auto}img[data-loading="true"]{opacity:.5}@media(max-width:1000px){header{flex-wrap:wrap;gap:6px 14px}.tools{margin-left:0}.identity small{display:none}}@media(max-width:600px){header{padding:8px}.identity{display:none}nav{width:100%;overflow:auto;flex-shrink:0}main{padding:5px}footer{padding:4px 8px}}
</style>
<header>
  <div class="identity"><strong>Fouc · 工作台首页</strong><small>5 种风格与编排 · 静态 UX 图</small></div>
  <nav id="styles" aria-label="首页设计方案"></nav>
  <div class="tools">
    <button id="whole" type="button" aria-pressed="false">整页</button>
    <button id="actual" type="button" aria-pressed="false">原尺寸</button>
    <a id="original" target="_blank" rel="noopener">原图</a>
    <a id="prompt" target="_blank" rel="noopener">提示词</a>
  </div>
</header>
<main id="viewer" data-scale="width"><figure><img id="screen" alt="" decoding="async"></figure></main>
<footer><span id="caption"></span><span id="status" role="status" aria-live="polite"></span><a href="../../../fouc-project-space-product-ux-design.md" target="_blank" rel="noopener">首页设计说明</a></footer>
<script>
const designs=[{id:'editorial',name:'编辑简报',file:'home.png',idea:'接续工作优先 · 编辑式留白与不对称层级'},{id:'ledger',name:'精密台账',file:'home.png',idea:'广幅工作台账 · 当前活动与下一步同列可读'},{id:'desk',name:'工作桌面',file:'home-v2.png',idea:'多项工作的内容预览 · 精细平面卡片'},{id:'nocturne',name:'深色指挥台',file:'home-v2.png',idea:'待人判断优先 · 现有 Fouc 深色主题'},{id:'tempo',name:'交付航线',file:'home-v2.png',idea:'本周推进与下次检查点 · 瑞士式时间编排'}];
const byId=id=>document.getElementById(id),nav=byId('styles'),viewer=byId('viewer'),screen=byId('screen');
for(const design of designs){const button=document.createElement('button');button.type='button';button.textContent=design.name;button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>{location.hash=design.id;});nav.append(button);}
function show(){const match=designs.find(item=>item.id===location.hash.slice(1))??designs[0];for(const [index,button]of [...nav.children].entries())button.setAttribute('aria-pressed',String(designs[index]===match));screen.dataset.loading='true';byId('status').textContent='载入中';screen.alt=match.name+' · Fouc 工作台首页静态设计';screen.src=match.id+'/'+match.file;byId('original').href=screen.src;byId('prompt').href=match.id+'/generation-prompts.json';byId('caption').textContent=match.idea;viewer.scrollTo({top:0,left:0});}
function scale(mode){viewer.dataset.scale=viewer.dataset.scale===mode?'width':mode;byId('whole').setAttribute('aria-pressed',String(viewer.dataset.scale==='page'));byId('actual').setAttribute('aria-pressed',String(viewer.dataset.scale==='actual'));viewer.scrollTo({top:0,left:0});}
screen.addEventListener('load',()=>{screen.dataset.loading='false';byId('status').textContent=screen.naturalWidth+' × '+screen.naturalHeight;});screen.addEventListener('error',()=>{screen.dataset.loading='false';byId('status').textContent='图像载入失败，可打开原图重试';});byId('whole').addEventListener('click',()=>scale('page'));byId('actual').addEventListener('click',()=>scale('actual'));window.addEventListener('hashchange',show);show();
</script>
</html>
