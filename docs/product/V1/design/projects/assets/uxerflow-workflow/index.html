<script>
'use strict';
const concepts = JSON.parse(document.getElementById('catalog').textContent);
const byId = id => document.getElementById(id);
const viewer = byId('viewer');
let activeConcept = 0;
let activePage = 0;
let originalSize = false;
let comparing = false;
const sourceVideo=byId('source-video'), sourceImage=byId('source-image'), sourceLink=byId('source-fallback');
let sourceFrame=0;
function updateAddress(fragment) {
  const address=new URL(location.href);
  address.hash=fragment;
  if(address.href!==location.href) history.replaceState(null,'',address.href);
}
function setReference() {
  const c=concepts[activeConcept], p=c.pages[activePage];
  const r=c.references[p.referenceIndex ?? 0] || c.references[0];
  sourceFrame=Number.isFinite(p.frameSecond)?p.frameSecond:(r.frameSecond??0);
  byId('source-name').textContent=r.title+(r.video?' · '+Number(sourceFrame.toFixed(3))+' 秒':'');
  byId('page-name').textContent=p.title;
  byId('original').href=r.url;
  sourceLink.href=r.url;
  byId('original-pane').hidden=!comparing;
  byId('compare').setAttribute('aria-pressed',String(comparing));
  byId('compare').textContent=comparing?'关闭对照':'原作对照';
  sourceVideo.pause();
  if(!comparing) return;
  const poster=r.preview||r.imageUrl||'';
  sourceImage.hidden=true;
  sourceLink.hidden=true;
  sourceVideo.hidden=!r.video;
  sourceImage.dataset.poster=poster;
  if(r.video){
    if(poster) sourceVideo.poster=poster;
    if(sourceVideo.getAttribute('src')!==r.video) sourceVideo.src=r.video;
    if(sourceVideo.readyState>=1) seekSource();
  } else showPoster();
}
function seekSource() {
  if(!Number.isFinite(sourceVideo.duration))return;
  sourceVideo.currentTime=Math.max(0,Math.min(sourceFrame,sourceVideo.duration-.08));
}
function showPoster() {
  sourceVideo.hidden=true;
  const poster=sourceImage.dataset.poster||'';
  sourceImage.hidden=!poster; sourceLink.hidden=Boolean(poster);
  if(poster && sourceImage.getAttribute('src')!==poster) sourceImage.src=poster;
  else if(poster && sourceImage.complete && !sourceImage.naturalWidth){sourceImage.hidden=true;sourceLink.hidden=false;}
}
sourceVideo.addEventListener('loadedmetadata',seekSource);
sourceVideo.addEventListener('error',showPoster);
sourceImage.addEventListener('error',()=>{sourceImage.hidden=true;sourceLink.hidden=false;});
function el(tag, cls, value) {
  const element = document.createElement(tag);
  if (cls) element.className = cls;
  if (value) element.textContent = value;
  return element;
}
function link(label, url) {
  const a = el('a', '', label);
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  return a;
}
function label(index) { return String(index + 1).padStart(2,'0'); }
function setSize() {
  byId('stage').className = 'stage ' + (originalSize ? 'natural' : 'fit') + (comparing?' compare':'');
  byId('zoom').setAttribute('aria-pressed', String(originalSize));
  byId('zoom').textContent = originalSize ? '适应窗口' : '原尺寸';
}
function selectPage(c, p) {
  activeConcept = c; activePage = p;
  updateAddress((c+1)+'/'+(p+1));
  const concept = concepts[c], page = concept.pages[p];
  byId('concept').value = String(c);
  byId('page').replaceChildren(...concept.pages.map((item,i) => new Option(label(i) + ' · ' + item.title, i)));
  byId('page').value = String(p);
  byId('full-image').src = page.src;
  byId('full-image').alt = concept.title + ' · ' + page.title;
  byId('open-png').href = page.src;
  setReference();
  byId('focus').textContent = page.focus;
  byId('link-hint').textContent = page.links?.length?'可点击画中操作':'';
  byId('full-image').style.cursor=''; byId('full-image').removeAttribute('title');
  byId('position').textContent = (p+1) + ' / ' + concept.pages.length;
  byId('previous').disabled = p === 0;
  byId('next').disabled = p === concept.pages.length - 1;
  byId('stage').scrollTo(0,0);
}
function show(c,p) {
  originalSize = false; comparing = false; setSize(); selectPage(c,p);
  if (!viewer.open) viewer.showModal();
  document.body.style.overflow = 'hidden';
}
byId('count').textContent = concepts.length + ' 套方案 · ' + concepts.reduce((n,c) => n+c.pages.length,0) + ' 个页面';
for (const [i,c] of concepts.entries()) {
  byId('concept').add(new Option(label(i) + ' · ' + c.title,i));
  const card = el('article','card');
  const button = el('button','preview');
  button.setAttribute('aria-label','查看' + c.title);
  const cover=c.cover??0;
  const photo=el('img'); photo.src=c.pages[cover].src; photo.alt=c.title+' · '+c.pages[cover].title;
  button.append(photo); button.addEventListener('click',() => show(i,cover));
  const caption = el('div','caption'), name = el('div','name');
  name.append(el('span','number',label(i)),el('h2','',c.title),el('span','studio',c.studio));
  const pages = el('div','pages');
  c.pages.forEach((p,j) => { const b=el('button','page-link',p.title); b.addEventListener('click',()=>show(i,j)); pages.append(b); });
  caption.append(name,el('p','',c.thesis),pages);
  const details=el('details','source-details'), list=el('ul');
  details.append(el('summary','','参考作品与编排'));
  for (const r of c.references) {
    const li=el('li'); li.append(link(r.title,r.url));
    if (r.video) li.append(' · ',link('原作视频',r.video));
    if (r.profileUrl) li.append(' · ',link('工作室主页',r.profileUrl));
    if (r.observed) li.append(el('div','',r.observed));
    if (r.audience) li.append(el('div','meta',r.audience));
    list.append(li);
  }
  details.append(list); if(c.meta) details.append(link('逐页设计依据与出图方法',c.meta)); card.append(button,caption,details); byId('grid').append(card);
}
byId('back').addEventListener('click',()=>viewer.close());
viewer.addEventListener('close',()=>{document.body.style.overflow='';sourceVideo.pause();updateAddress('');});
byId('concept').addEventListener('change',e=>selectPage(Number(e.target.value),0));
byId('page').addEventListener('change',e=>selectPage(activeConcept,Number(e.target.value)));
byId('zoom').addEventListener('click',()=>{originalSize=!originalSize;comparing=false;setReference();setSize();});
byId('compare').addEventListener('click',()=>{comparing=!comparing;originalSize=false;setReference();setSize();});
byId('previous').addEventListener('click',()=>selectPage(activeConcept,activePage-1));
byId('next').addEventListener('click',()=>selectPage(activeConcept,activePage+1));
const artwork = byId('full-image');
function linkAt(event) {
  const bounds=artwork.getBoundingClientRect();
  if(!bounds.width || !bounds.height) return;
  const x=(event.clientX-bounds.left)*artwork.naturalWidth/bounds.width;
  const y=(event.clientY-bounds.top)*artwork.naturalHeight/bounds.height;
  return concepts[activeConcept].pages[activePage].links?.find(([,target,left,top,width,height])=>x>=left&&x<=left+width&&y>=top&&y<=top+height);
}
artwork.addEventListener('pointermove',event=>{
  const dest=linkAt(event);
  artwork.style.cursor=dest?'pointer':'';
  if(dest) artwork.title=dest[0]; else artwork.removeAttribute('title');
});
artwork.addEventListener('click',event=>{const dest=linkAt(event);if(dest)selectPage(activeConcept,dest[1]);});
function openHash() {
  const match=location.hash.match(/^#(\d+)(?:\/(\d+))?$/);
  if(!match) return;
  const c=Number(match[1])-1, p=Number(match[2]||1)-1;
  if(concepts[c] && concepts[c].pages[p]) show(c,p);
}
openHash();
window.addEventListener('hashchange',openHash);
viewer.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  if(e.key==='ArrowLeft'&&activePage>0) { e.preventDefault();selectPage(activeConcept,activePage-1); }
  if(e.key==='ArrowRight'&&activePage+1<concepts[activeConcept].pages.length) { e.preventDefault();selectPage(activeConcept,activePage+1); }
});
</script>
